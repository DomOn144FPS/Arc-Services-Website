<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arc — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="login-body">

<div class="hero-glow login-glow"></div>

<div class="login-center">
  <div class="login-card">
    <!-- Arc logo -->
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 20h16L12 2z" fill="white" opacity="0.9"/>
        <path d="M12 2L4 20h8V2z" fill="white" opacity="0.4"/>
      </svg>
    </div>

    <h2 class="login-title">Sign in</h2>

    <div class="login-form">
      <input type="email" class="login-input" placeholder="Email" autocomplete="email">
      <input type="password" class="login-input" placeholder="Password" autocomplete="current-password">

      <div class="login-links">
        <a href="#" class="login-link">Forgot password?</a>
        <a href="#" class="login-link">Create account</a>
      </div>

      <button class="login-btn">Continue</button>
    </div>
  </div>
</div>

</body>
</html>
