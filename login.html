<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arc</title>
<link rel="stylesheet" href="shared.css">
</head>
<body class="bg-galaxy">

<main class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <img src="https://arc-services.dev/Arc_Transparent.png" alt="Arc">
    </div>

    <h2 class="login-title">Sign in</h2>

    <div class="login-inputs">
      <input class="login-input" type="email" placeholder="Email" id="emailInput" oninput="checkInputs()">
      <input class="login-input" type="password" placeholder="Password" id="passInput" oninput="checkInputs()">
    </div>

    <div class="login-footer-links">
      <button>Forgot password?</button>
      <button>Create account</button>
    </div>

    <button class="login-btn" id="continueBtn" disabled>Continue</button>

  </div>
</main>

<script>
function checkInputs(){
  const email=document.getElementById('emailInput').value.trim();
  const pass=document.getElementById('passInput').value.trim();
  const btn=document.getElementById('continueBtn');
  if(email&&pass){btn.classList.add('active');btn.disabled=false;}
  else{btn.classList.remove('active');btn.disabled=true;}
}
</script>

</body>
</html>
